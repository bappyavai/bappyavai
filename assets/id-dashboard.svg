<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b16" />
      <stop offset="100%" stop-color="#0d152b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111c38" />
      <stop offset="100%" stop-color="#090f20" />
    </linearGradient>
    <linearGradient id="electricBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d8ff" />
      <stop offset="50%" stop-color="#247bff" />
      <stop offset="100%" stop-color="#ff354f" />
    </linearGradient>
    <linearGradient id="lanyardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2a5c" />
      <stop offset="100%" stop-color="#247bff" />
    </linearGradient>
    <linearGradient id="foilSweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00d8ff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="330" y="95" width="240" height="335" rx="18" />
    </clipPath>
    <clipPath id="photoClip">
      <rect x="375" y="135" width="150" height="145" rx="14" />
    </clipPath>
  </defs>

  <style>
    @keyframes pendulumSwing {
      0%   { transform: rotate(-1.7deg); }
      50%  { transform: rotate(1.7deg); }
      100% { transform: rotate(-1.7deg); }
    }
    @keyframes foilMove {
      0%   { transform: translateX(-260px); }
      50%  { transform: translateX(260px); }
      100% { transform: translateX(-260px); }
    }
    .swing-group {
      transform-origin: 450px 0px;
      animation: pendulumSwing 4.5s ease-in-out infinite;
    }
    .foil {
      animation: foilMove 5s ease-in-out infinite;
    }
    .title { font-family: Arial, Helvetica, sans-serif; font-weight: 800; }
    .mono  { font-family: 'Courier New', monospace; font-weight: 700; }
  </style>

  <!-- Background -->
  <rect width="900" height="460" rx="22" fill="url(#bgGrad)" stroke="#1b2b52" stroke-width="2" />

  <!-- Left Info Panel -->
  <g transform="translate(50, 75)">
    <text x="0" y="25" fill="#00d8ff" font-size="13" letter-spacing="3" class="mono">VERIFIED DEVELOPER ID</text>
    <text x="0" y="65" fill="#ffffff" font-size="32" class="title">SWAPNADEEP</text>
    <text x="0" y="92" fill="#247bff" font-size="16" class="title">Deep vai - BCA Student</text>
    
    <rect x="0" y="115" width="235" height="58" rx="10" fill="#0d1730" stroke="#247bff" stroke-width="1.2" />
    <text x="15" y="138" fill="#8b949e" font-size="11" class="mono">PRIMARY FOCUS</text>
    <text x="15" y="160" fill="#ffffff" font-size="14" class="title">C Programming & AI/ML</text>

    <rect x="0" y="188" width="235" height="58" rx="10" fill="#0d1730" stroke="#247bff" stroke-width="1.2" />
    <text x="15" y="211" fill="#8b949e" font-size="11" class="mono">LOCATION</text>
    <text x="15" y="233" fill="#00d8ff" font-size="14" class="title">India</text>

    <rect x="0" y="261" width="235" height="58" rx="10" fill="#0d1730" stroke="#ff354f" stroke-width="1.2" />
    <text x="15" y="284" fill="#8b949e" font-size="11" class="mono">STATUS</text>
    <text x="15" y="306" fill="#ff354f" font-size="14" class="title">Open to Collaborate</text>
  </g>

  <!-- Right Stack Panel -->
  <g transform="translate(615, 75)">
    <text x="0" y="25" fill="#00d8ff" font-size="13" letter-spacing="3" class="mono">CORE STACK</text>
    
    <rect x="0" y="45" width="235" height="48" rx="10" fill="#0d1730" stroke="#00d8ff" stroke-width="1.2" />
    <text x="15" y="74" fill="#ffffff" font-size="14" class="title">> C & Python Logic</text>

    <rect x="0" y="108" width="235" height="48" rx="10" fill="#0d1730" stroke="#247bff" stroke-width="1.2" />
    <text x="15" y="137" fill="#ffffff" font-size="14" class="title">> AI & Machine Learning</text>

    <rect x="0" y="171" width="235" height="48" rx="10" fill="#0d1730" stroke="#247bff" stroke-width="1.2" />
    <text x="15" y="200" fill="#ffffff" font-size="14" class="title">> HTML - CSS - JS</text>

    <rect x="0" y="234" width="235" height="85" rx="10" fill="#0d1730" stroke="#1f3566" stroke-width="1.2" />
    <text x="15" y="260" fill="#8b949e" font-size="11" class="mono">MOTTO</text>
    <text x="15" y="284" fill="#ffffff" font-size="15" class="title">Dream Big...</text>
    <text x="15" y="305" fill="#ff354f" font-size="15" class="title">Code Better...</text>
  </g>

  <!-- Hanging Lanyard ID Card -->
  <g class="swing-group">
    <polygon points="432,0 468,0 460,72 440,72" fill="url(#lanyardGrad)" />
    <text x="450" y="42" fill="#ffffff" font-size="9" text-anchor="middle" letter-spacing="2" class="mono">DEEP</text>
    
    <rect x="441" y="68" width="18" height="16" rx="4" fill="#94a3b8" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="450" cy="88" r="7" fill="none" stroke="#cbd5e1" stroke-width="2.5" />

    <rect x="330" y="95" width="240" height="335" rx="18" fill="url(#cardGrad)" stroke="url(#electricBorder)" stroke-width="2.5" />
    <rect x="432" y="106" width="36" height="6" rx="3" fill="#070b16" stroke="#247bff" stroke-width="1" />

    <rect x="375" y="135" width="150" height="145" rx="14" fill="#132247" stroke="#00d8ff" stroke-width="2" />
    <g clip-path="url(#photoClip)">
      <circle cx="420" cy="195" r="55" fill="#247bff" opacity="0.35" />
      <circle cx="485" cy="200" r="50" fill="#ff354f" opacity="0.3" />
      <circle cx="450" cy="188" r="28" fill="#e2e8f0" />
      <path d="M398,280 C398,242 502,242 502,280 Z" fill="#1e293b" />
      <text x="450" y="264" fill="#00d8ff" font-size="14" text-anchor="middle" class="mono"><DEV/></text>
    </g>

    <text x="450" y="308" fill="#ffffff" font-size="21" text-anchor="middle" class="title">Swapnadeep</text>
    <text x="450" y="329" fill="#00d8ff" font-size="13" text-anchor="middle" class="title">Deep vai</text>
    <text x="450" y="349" fill="#94a3b8" font-size="12" text-anchor="middle" class="mono">BCA Student - @bappyavai</text>

    <!-- Barcode -->
    <g transform="translate(365, 368)" fill="#cbd5e1" opacity="0.85">
      <rect x="0" y="0" width="3" height="28" /><rect x="6" y="0" width="2" height="28" />
      <rect x="12" y="0" width="5" height="28" /><rect x="21" y="0" width="2" height="28" />
      <rect x="27" y="0" width="4" height="28" /><rect x="35" y="0" width="2" height="28" />
      <rect x="41" y="0" width="6" height="28" /><rect x="51" y="0" width="2" height="28" />
      <rect x="57" y="0" width="3" height="28" /><rect x="64" y="0" width="5" height="28" />
      <rect x="73" y="0" width="2" height="28" /><rect x="79" y="0" width="4" height="28" />
      <rect x="87" y="0" width="2" height="28" /><rect x="93" y="0" width="6" height="28" />
      <rect x="103" y="0" width="3" height="28" /><rect x="110" y="0" width="2" height="28" />
      <rect x="116" y="0" width="5" height="28" /><rect x="125" y="0" width="3" height="28" />
      <rect x="132" y="0" width="2" height="28" /><rect x="138" y="0" width="4" height="28" />
      <rect x="146" y="0" width="2" height="28" /><rect x="152" y="0" width="5" height="28" />
      <rect x="161" y="0" width="3" height="28" /><rect x="167" y="0" width="3" height="28" />
    </g>
    <text x="450" y="412" fill="#247bff" font-size="10" text-anchor="middle" letter-spacing="3" class="mono">ID: 2026-BCA-IND</text>

    <g clip-path="url(#cardClip)">
      <rect class="foil" x="300" y="90" width="120" height="350" fill="url(#foilSweep)" transform="skewX(-20)" />
    </g>
  </g>
</svg>
